name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write        # required for NuGet Trusted Publishing (OIDC)

jobs:
  github-release:
    name: Create GitHub Release And Publish NuGet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TBankNet.Multisplit.slnx

      - name: Build
        run: dotnet build TBankNet.Multisplit.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TBankNet.Multisplit.slnx --configuration Release --no-build --verbosity normal

      - name: Pack Packages
        run: >
          dotnet pack src/TBankNet.Multisplit/TBankNet.Multisplit.csproj
          --configuration Release
          --no-build
          --output artifacts/packages

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          args=(
            artifacts/packages/*
            --title "TBankNet.Multisplit ${TAG_NAME#v}"
            --generate-notes
            --verify-tag
          )

          if [[ "$TAG_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi

          gh release create "$TAG_NAME" "${args[@]}"

      # NuGet Trusted Publishing: exchanges the GitHub OIDC token for a short-lived
      # NuGet.org API key. Requires a trusted publishing policy configured on NuGet.org
      # and the NUGET_USER repository variable set to the owning account.
      - name: NuGet Trusted Publishing Login
        if: vars.NUGET_USER != ''
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish NuGet Packages
        if: vars.NUGET_USER != ''
        run: |
          for package in artifacts/packages/*.nupkg artifacts/packages/*.snupkg; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done

      - name: Skip NuGet Publish
        if: vars.NUGET_USER == ''
        run: echo "NUGET_USER repository variable is not set; GitHub Release artifacts were created but packages were not published to NuGet.org. Configure NuGet Trusted Publishing to enable it."
